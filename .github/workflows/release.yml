name: release

# Pushing a v* tag is the whole release ritual: this builds mp3fy on each OS
# it ships for and attaches the installers to a GitHub Release, so a phone or
# a borrowed laptop can install it straight from the Releases page.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs on both Apple Silicon and Intel.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: ubuntu-24.04
            rust-targets: ''
            args: ''
          - platform: windows-latest
            rust-targets: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          # Tauri v2's Ubuntu list. Note `libayatana-appindicator3-dev`:
          # `libappindicator3-dev` no longer exists on 24.04.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mp3fy __VERSION__
          releaseBody: |
            Download the file for your platform below, then see the
            [install notes](https://github.com/morethancoder/mp3fy#install).

            The bundles are unsigned, so macOS and Windows will ask before the
            first launch — the install notes say what to click.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Android is its own build (Gradle + the NDK, not tauri-action) and attaches
  # to the release the desktop jobs created, so it waits for them.
  android:
    needs: bundle
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the APK would be unsigned and uninstallable"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/mp3fy.jks"
          cat > src-tauri/gen/android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/mp3fy.jks
          password=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          PROPS

      # One APK per architecture, not one universal APK. The engine's Python
      # and ffmpeg payloads are ~50MB *per* ABI, so a universal build is 209MB
      # of which a phone uses a quarter. The unsuffixed file is the arm64 one,
      # which is every Android phone worth speaking of; the others are there
      # for old 32-bit devices and emulators.
      # `--target` takes repeated values, not a comma-separated list.
      - name: Build the APKs
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 --target armv7 --target x86_64

      - name: Attach the APKs to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          out=src-tauri/gen/android/app/build/outputs/apk
          attach() { # attach <flavor> <suffix>
            apk=$(find "$out/$1" -name "*release*.apk" 2>/dev/null | head -1)
            if [ -z "$apk" ]; then
              echo "::warning::no release APK for $1"
              return
            fi
            name="mp3fy_${version}_android$2.apk"
            cp "$apk" "$name"
            gh release upload "$GITHUB_REF_NAME" "$name" --clobber
            echo "attached $name ($(du -h "$name" | cut -f1))"
          }
          attach arm64 ""
          attach arm "_arm32"
          attach x86_64 "_x86_64"
          test -f "mp3fy_${version}_android.apk" || {
            echo "::error::the arm64 APK is missing — that is the one nearly everyone installs"
            exit 1
          }
