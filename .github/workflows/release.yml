name: release

# Pushing a v* tag is the whole release ritual: this builds mp3fy on each OS
# it ships for and attaches the installers to a GitHub Release, so a phone or
# a borrowed laptop can install it straight from the Releases page.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs on both Apple Silicon and Intel.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: ubuntu-24.04
            rust-targets: ''
            args: ''
          - platform: windows-latest
            rust-targets: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mp3fy __VERSION__
          releaseBody: |
            Download the file for your platform below, then see the
            [install notes](https://github.com/morethancoder/mp3fy#install).

            The bundles are unsigned, so macOS and Windows will ask before the
            first launch — the install notes say what to click.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
