<!doctype html>
<html lang="en" data-theme="light" data-accent="plum" data-radius="round" data-density="comfortable">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<script>
			// Resolve the theme before first paint, or the page flashes light and
			// then corrects itself once the app hydrates. Kept in sync with
			// $lib/theme — same key, same three values.
			try {
				var pref = localStorage.getItem('mp3fy-theme') || 'system';
				var dark =
					pref === 'dark' ||
					(pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			} catch (e) {}
			// Same idea for direction: resolve Arabic before first paint, or an
			// RTL user watches the page flip after hydration. Kept in sync with
			// $lib/i18n.svelte — same key, same values.
			try {
				var lang = localStorage.getItem('mp3fy-app-language') || 'system';
				if (lang === 'system') {
					lang = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
				}
				document.documentElement.lang = lang;
				document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="shell">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
