[package]
name = "mp3fy"
version = "0.5.0"
description = "Turn any video link into a local audio file, powered by yt-dlp"
license = "MIT"
edition = "2021"

[lib]
name = "mp3fy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# A debug build of this tree was 6.5 GB, and 4.4 GB of that was DWARF for
# crates nobody here will ever step into — hyper, rustls, tokio, wry. Deps get
# no debug info at all; our own code keeps line tables, which is all a readable
# backtrace needs. Panics still name the file and line in mp3fy's own frames.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
